name: Release

# Pushing a v* tag builds both images, pushes them to GHCR, signs them with
# cosign (keyless, via GitHub OIDC), attaches a Syft SBOM and SLSA build
# provenance, and publishes a GitHub Release. How to verify all of it is in
# the README ("Verifying a release").

on:
  push:
    tags: ["v*.*.*"]

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

# Never cancel a release half-way through signing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  COSIGN_VERSION: v3.1.3

jobs:
  # Tags can point at any commit. Only release commits that went through
  # the protected main branch (and therefore passed CI and the security
  # gates).
  verify-tag:
    name: Verify tag is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check ancestry
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} ($GITHUB_SHA) is not on main; refusing to release."
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify-tag
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # OIDC token for keyless signing and attestations
      attestations: write # store build provenance
    strategy:
      fail-fast: true
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Image name
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        # GHCR names must be lowercase; the org name is not.
        run: echo "image=${REGISTRY}/${OWNER,,}/secure-sdlc-lab-${IMAGE}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # No build cache here: a release must not reuse layers another
      # workflow could have written.
      - id: build
        name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false # provenance comes from attest-build-provenance below
          sbom: false # the SBOM comes from Syft below

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Sign the digest, never a tag: tags can be moved, digests cannot.
      - name: Sign image (keyless)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.image }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM to the image (signed attestation)
        env:
          REF: ${{ steps.name.outputs.image }}@${{ steps.build.outputs.digest }}
          SBOM: sbom-${{ matrix.image }}.spdx.json
        run: cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"

      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.name.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: echo "${IMAGE}@${DIGEST}" > "digest-${NAME}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.image }}
          path: |
            sbom-${{ matrix.image }}.spdx.json
            digest-${{ matrix.image }}.txt
          retention-days: 7

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Write release notes header
        run: |
          {
            echo "## Images"
            echo
            echo "Pull by digest. Signatures, SBOMs and provenance are attached to these digests."
            echo
            echo '```'
            cat dist/digest-*.txt
            echo '```'
            echo
            echo "See the README section \"Verifying a release\" for the cosign and gh commands."
          } > notes.md

      # --generate-notes appends a changelog built from the PRs merged since
      # the previous tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG"
          --verify-tag --title "$TAG" --generate-notes --notes-file notes.md
          dist/sbom-*.spdx.json
