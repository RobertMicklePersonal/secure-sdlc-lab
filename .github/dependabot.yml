# The Dockerfile ecosystem is added in phase 3.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      # Batch routine dev-tool bumps; runtime deps and security fixes stay separate.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
