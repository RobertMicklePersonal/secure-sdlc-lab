version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/start-stack]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Types track the Node major we run (24 LTS); bump them with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Batch routine dev-tool bumps; runtime deps and security fixes stay separate.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly

  # Base images are pinned by digest; Dependabot bumps tag and digest together.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Stay on Node LTS lines; move majors deliberately, with CI and types.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
