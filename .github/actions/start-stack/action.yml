name: Start stack
description: >
  Starts the app with docker compose and waits until both containers are
  healthy. "build" builds images from this checkout; "release" runs the
  latest GitHub release's images, pinned by digest after cosign verifies
  they were signed by this repo's release workflow.

inputs:
  source:
    description: build or release
    required: true
    default: build

runs:
  using: composite
  steps:
    - name: Check input
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
      run: |
        case "$SOURCE" in
          build|release) ;;
          *) echo "::error::source must be build or release, got '$SOURCE'"; exit 1 ;;
        esac

    - if: inputs.source == 'release'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.3

    - if: inputs.source == 'release'
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Resolve and verify release images
      id: images
      if: inputs.source == 'release'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        OWNER: ${{ github.repository_owner }}
      run: |
        set -euo pipefail
        tag="$(gh release view --repo "$REPO" --json tagName --jq .tagName)"
        echo "Latest release: $tag"
        for name in backend frontend; do
          image="ghcr.io/${OWNER,,}/secure-sdlc-lab-${name}"
          digest="$(docker buildx imagetools inspect "${image}:${tag#v}" --format '{{json .Manifest}}' | jq -r .digest)"
          # Only scan what the release workflow signed for exactly this tag.
          cosign verify "${image}@${digest}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${tag}" \
            > /dev/null
          echo "Verified ${image}@${digest}"
          echo "${name}=${image}@${digest}" >> "$GITHUB_OUTPUT"
        done

    - name: docker compose up
      shell: bash
      env:
        SOURCE: ${{ inputs.source }}
        # Empty unless source is release; compose then uses the local builds.
        API_IMAGE: ${{ steps.images.outputs.backend }}
        WEB_IMAGE: ${{ steps.images.outputs.frontend }}
      run: |
        if [ "$SOURCE" = release ]; then
          docker compose up --detach --no-build --wait --wait-timeout 120
        else
          docker compose up --detach --build --wait --wait-timeout 300
        fi
        docker compose ps
        curl --fail --silent --show-error http://localhost:8080/healthz
